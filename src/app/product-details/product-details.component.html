<div class="product-details-container">
  
  <!-- Back button -->
  <div class="back-link-wrapper">
    <a routerLink="/" class="back-to-products-btn">
      <i class="fa-solid fa-arrow-left"></i> Back to Products
    </a>
  </div>

  <div *ngIf="loading" class="loading-state">
    Loading product details...
  </div>

  <div *ngIf="!loading && !product" class="not-found-state">
    Product not found.
  </div>

  <div *ngIf="product" class="product-details-content">
    <!-- Product Image & Gallery -->
    <div class="gallery-column">
      <div class="main-image-container">
        <img [src]="activeImage || 'https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=800&auto=format&fit=crop'" 
             [alt]="product.name" 
             class="main-product-image" />
      </div>
      
      <!-- Thumbnails Gallery -->
      <div *ngIf="images && images.length > 1" class="thumbnails-strip">
        <div *ngFor="let img of images" 
             (click)="selectImage(img)"
             [class.active]="img === activeImage"
             class="thumbnail-wrapper">
          <img [src]="img" [alt]="product.name" />
        </div>
      </div>
    </div>

    <!-- Product Info -->
    <div class="info-column">
      <h2 class="product-name-title">{{product.name}}</h2>
      
      <div class="product-detail-price">
        ${{product.price}}
      </div>
      
      <div class="product-detail-actions">
        <button class="add-to-cart-btn" (click)="addToBag()">
          <i class="fa-solid fa-bag-shopping"></i> Add to Bag
        </button>
      </div>

      <div class="product-detail-description">
        <h3>Product Details</h3>
        <div [innerHTML]="product.description || 'Premium catalog product crafted with high quality standards.'" 
             class="description-html">
        </div>
      </div>
    </div>
  </div>

</div>
